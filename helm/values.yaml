nameOverride: ""
fullnameOverride: "vp-fms-interceptor"

replicaCount: 1

image:
  repository: repouat.maybank.co.id:8082/vp-fms-interceptor
  tag: rust-1.0.0
  pullPolicy: Always

serviceAccount:
  name: vynamic-uat-1-sa

service:
  type: ClusterIP
  ports:
    main:
      name: tcp-main
      port: 9100
      targetPort: 9100
      protocol: TCP
    admin:
      name: http-admin
      port: 9101
      targetPort: 9101
      protocol: TCP

resources:
  requests:
    cpu: "500m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

log:
  pvcName: vp-fms-interceptor-log-pvc
  mountPath: /var/log/vp-fms-interceptor
  storageClassName: netapp-files-dynamic
  size: 5Gi
  accessMode: ReadWriteMany

config:
  mountDir: /etc/vp-fms
  fileName: config.toml
  content: |
    # VP -> FMS TCP interceptor.
    #
    # Design rule encoded in this file: nothing under [kafka] or [tee] is allowed to
    # affect the VP<->FMS path. Tuning them wrong costs you observability, never
    # availability.

    [listen]
    # Point VP at this address instead of at FMS directly.
    addr = "0.0.0.0:9100"
    # Hard cap on concurrent VP connections. Excess connections are accepted and
    # closed immediately rather than queued, so VP sees a fast failure.
    max_connections = 4096

    [upstream]
    # The real FMS endpoint.
    addr = "192.168.249.150:11682"
    connect_timeout_ms = 3000

    [proxy]
    read_buffer_bytes = 16384
    # TCP_NODELAY on both sockets. Leave this on: Nagle can add ~40ms to small
    # ISO 8583 messages, which dwarfs everything else this program does.
    nodelay = true
    # Close an idle connection after this long. 0 disables.
    idle_timeout_ms = 0

    [tee]
    # Number of framing/publish workers. Connections are assigned conn_id % shards,
    # so each worker owns its framer state without locking.
    shards = 4
    # Per-shard bounded queue. When full, frames are DROPPED and counted.
    # This bound is the isolation boundary between Kafka and the hot path.
    queue_capacity = 8192
    # vp_to_fms | fms_to_vp | both
    publish_directions = "both"

    [framing]
    # length_prefix | raw
    #   length_prefix -> reassemble whole messages (what you want for ISO 8583)
    #   raw           -> publish socket reads as-is, no reassembly
    mode = "length_prefix"
    prefix_bytes = 2
    big_endian = true
    length_includes_prefix = false
    max_frame_bytes = 65536

    [timing]
    enabled = true
    pair_request_response = true
    max_pending = 256

    [debug_payload]
    enabled = true
    max_bytes = 65536

    [parse]
    mode = "none"
    pair_delimiter = ","
    kv_delimiter = "="
    trim = true
    max_fields = 64

    [kafka]
    enabled = true
    brokers = "10.235.83.34:9092"
    topic = "vp.fms.iso8583"
    value_format = "json"
    payload_encoding = "base64"
    acks = "1"
    compression = "lz4"
    linger_ms = 5
    message_timeout_ms = 5000
    queue_buffering_max_messages = 100000
    queue_buffering_max_kbytes = 262144

    [kafka.filter]
    any_of = [
      { all_of = [
          { mti = ["0800", "0810"] },
          { de70 = ["301", "001"] }
        ] }
    ]

    [kafka.properties]
    # "security.protocol" = "SASL_SSL"
    # "sasl.mechanisms" = "PLAIN"

    [admin]
    addr = "0.0.0.0:9101"

secret:
  enabled: false
  existingSecretName: vp-fms-interceptor-secret

probes:
  readiness:
    path: /healthz
    port: 9101
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    path: /healthz
    port: 9101
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
