apiVersion: v1
kind: Service
metadata:
  name: {{ include "vp-fms-interceptor.fullname" . }}
  labels:
{{ include "vp-fms-interceptor.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
{{ include "vp-fms-interceptor.selectorLabels" . | indent 4 }}
  ports:
    - name: {{ .Values.service.ports.main.name }}
      port: {{ .Values.service.ports.main.port }}
      targetPort: {{ .Values.service.ports.main.targetPort }}
      protocol: {{ .Values.service.ports.main.protocol }}
    - name: {{ .Values.service.ports.admin.name }}
      port: {{ .Values.service.ports.admin.port }}
      targetPort: {{ .Values.service.ports.admin.targetPort }}
      protocol: {{ .Values.service.ports.admin.protocol }}
